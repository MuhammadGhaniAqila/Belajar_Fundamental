<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
    <link rel="icon" href="./ini-foto/naga.jpg">
</head>
<body>
    <h2>Belajar bikin tabel</h2>
    <div class="tabel">
        <table style="border: 1px solid  rgb(0, 0, 0);">
            <colgroup>
                <col span="2" style="background-color: sandybrown;">
                <col style="background-color: blue;">
            </colgroup>
            <thead>
                <tr>
                    <th colspan="2">Nama</th>
                    <th>Nilai</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>gani</td>
                    <td>aqila</td>
                    <td>100</td>
                </tr>
                    <tr>
                    <td>aqila</td>
                    <td>wil</td>
                    <td>100</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">rata-rata</td>
                    <td>100</td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
